worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Basic rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;

  upstream api_upstream {
    server api:3001;
  }

  upstream web_upstream {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;

    location /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Redirect HTTP → HTTPS in production (uncomment when certs present)
    # return 301 https://$host$request_uri;

    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://api_upstream/health;
    }

    location /v1/stream {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /_next/static/ {
      limit_req zone=web burst=100 nodelay;
      proxy_pass http://web_upstream;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      limit_req zone=web burst=80 nodelay;
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # TLS termination (mount certs into /etc/nginx/certs)
  # server {
  #   listen 443 ssl http2;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ... same locations as above ...
  # }
}
