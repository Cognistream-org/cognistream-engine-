services:
  postgres:
    image: postgres:16-alpine
    container_name: cognistream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognistream
      POSTGRES_PASSWORD: cognistream
      POSTGRES_DB: cognistream
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cognistream -d cognistream']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cognistream-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Jaeger all-in-one (OTLP HTTP :4318, UI :16686)
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: cognistream-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:16686/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
